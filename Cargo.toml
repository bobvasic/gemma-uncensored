[package]
name = "gemma-uncensored"
version = "0.1.0"
edition = "2021"
description = "Fast terminal chat for a self-hosted Gemma 4 Ultra Uncensored (Heretic) endpoint"
license = "MIT"
repository = "https://github.com/bobvasic/gemma-uncensored"
readme = "README.md"
keywords = ["llm", "gemma", "llama-cpp", "digitalocean", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "gemma"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.10"
rpassword = "7"
ctrlc = "3"
rustyline = "14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
